services:
  portal:
    image: overleaf-ce-portal:latest
    build:
      context: .
      dockerfile: Dockerfile.bun
    env_file:
      - .env.docker
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3100:3000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - overleaf-toolkit

networks:
  overleaf-toolkit:
    external: true
    name: overleaf_default
